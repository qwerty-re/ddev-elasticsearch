#ddev-generated
services:
  elasticsearch:
    container_name: ddev-${DDEV_SITENAME}-elasticsearch
    hostname: ${DDEV_SITENAME}-elasticsearch
    image: ${ELASTICSEARCH_DOCKER_IMAGE:-elasticsearch:9.4.4}
    expose:
      - "9200"
      - "9300"
    environment:
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - VIRTUAL_HOST=elasticsearch.${DDEV_TLD}
      - HTTP_EXPOSE=80:9200
      - HTTPS_EXPOSE=443:9200
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
      - ".:/mnt/ddev_config"
      - ./elasticsearch/config/plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
      - ./elasticsearch/config/elasticsearch9.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s elasticsearch:9200"]

volumes:
  elasticsearch:
